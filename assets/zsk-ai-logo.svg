<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="50%" stop-color="#92FE9D" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FC466B" />
      <stop offset="100%" stop-color="#3F5EFB" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" rx="24" fill="#060A16" />
  <g filter="url(#glow)">
    <path d="M140 275 L220 100 L300 275 H260 L245 225 H175 L160 275 H140 Z" fill="url(#grad1)" />
    <path d="M340 275 H420 L460 180 L500 275 H540 L580 100 H540 L510 220 L470 100 H430 L390 220 L360 100 H320 L340 275 Z" fill="url(#grad2)" />
    <path d="M610 275 H730 V235 H655 V100 H615 V235 H610 V275 Z" fill="url(#grad1)" />
  </g>

  <text x="120" y="355" font-family="Inter, sans-serif" font-size="42" fill="#FFFFFF" letter-spacing="2">
    ZsK AI — Intelligent Host
  </text>

  <circle cx="370" cy="120" r="42" fill="none" stroke="#00C9FF" stroke-width="3">
    <animate attributeName="r" values="42;52;42" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <circle cx="370" cy="120" r="82" fill="none" stroke="#92FE9D" stroke-width="2" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0 260;130 130;0 260" dur="4s" repeatCount="indefinite" />
    <animate attributeName="transform" attributeType="XML" type="rotate" from="0 370 120" to="360 370 120" dur="14s" repeatCount="indefinite" />
  </circle>

  <circle cx="310" cy="90" r="8" fill="#ffffff">
    <animate attributeName="cx" values="310;430;310" dur="5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="90;150;90" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="470" cy="90" r="8" fill="#FC466B">
    <animate attributeName="cx" values="470;350;470" dur="4.6s" repeatCount="indefinite" />
    <animate attributeName="cy" values="90;135;90" dur="4.6s" repeatCount="indefinite" />
  </circle>

  <circle cx="370" cy="40" r="10" fill="url(#spark)">
    <animate attributeName="r" values="10;16;10" dur="2.1s" repeatCount="indefinite" />
  </circle>

  <text x="110" y="70" font-family="Inter, sans-serif" font-size="24" fill="#B3C7FF" opacity="0.85">
    Professional moveme nt logo for ZsK AI with motion glow.
  </text>
</svg>